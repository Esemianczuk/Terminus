name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install uv
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb xdotool libegl1 libopengl0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxkbcommon-x11-0
      - run: uv sync --frozen --python 3.11 --extra test --extra desktop
      - run: uv run --frozen python -m pytest -q
      - run: uv run --frozen python scripts/collective_bank.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check web/app.js
      - run: node --check web/service-worker.js
      - run: node --test tests/*.test.mjs
