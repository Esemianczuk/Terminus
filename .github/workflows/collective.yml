name: Collective memory
on:
  push:
    branches: [main]
    paths: ['community/contributions/*.json']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: terminus-collective-bank
  cancel-in-progress: false
jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install uv
      - run: uv sync --frozen
      - name: Merge category-only updates
        run: |
          git config user.name "Terminus collective"
          git config user.email "terminus-collective@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            uv run python scripts/collective_bank.py
            git add community
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "Update the category-only collective memory bank"
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
