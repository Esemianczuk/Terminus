[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "terminus-organism"
version = "0.3.0"
license = "MIT"
description = "A local, persistent little creature that learns the rhythm around it."
requires-python = ">=3.10"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "websockets>=13,<17", "numpy>=1.24,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "websockets>=13,<17"]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]
art = ["Pillow>=10,<13", "opencv-python-headless>=4.10,<5"]
desktop = ["PySide6>=6.8,<6.11", "pyobjc-framework-Cocoa>=10,<13; sys_platform == 'darwin'"]

[project.scripts]
terminus = "terminus.__main__:main"

[tool.setuptools.packages.find]
include = ["terminus*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
